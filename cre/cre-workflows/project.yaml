# ==========================================================================
# CRE Project Settings — 4626 Protocol Workflows
# ==========================================================================
# Template-aligned target structure:
# - local-simulation  -> reproducible local `cre workflow simulate`
# - staging-settings  -> deployment-intent settings with placeholders
# - production-settings -> production deployment settings with placeholders
#
# Notes:
# - `cre-cli.don-family` is only needed for DON deployment targets.
# - `account.workflow-owner-address` is optional, but required for --unsigned
#   workflow operations.
# ==========================================================================

local-simulation:
  rpcs:
    # CRE CLI requires an Ethereum mainnet RPC for some account/registry ops.
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
    - chain-name: ethereum-mainnet-base-1
      url: https://mainnet.base.org

staging-settings:
  cre-cli:
    # Replace with your assigned DON family once approved.
    don-family: "zone-a"
  rpcs:
    # FIX: M-12 (4626-321) — staging previously referenced
    # publicnode.com / mainnet.base.org. Public endpoints have
    # 10–100 req/s limits and no SLA; CRE workflows that exceed the
    # limit fail silently, missing on-chain events (and therefore
    # missing lottery settlements, rebalance cadence, etc.). Staging
    # now uses the same keyed Infura project as production via
    # ${INFURA_PROJECT_ID_STAGING}. Operators are expected to set a
    # separate staging key so staging load does not exhaust the
    # production quota.
    - chain-name: ethereum-mainnet
      url: https://mainnet.infura.io/v3/${INFURA_PROJECT_ID_STAGING}
    - chain-name: ethereum-mainnet-base-1
      url: https://base-mainnet.infura.io/v3/${INFURA_PROJECT_ID_STAGING}

production-settings:
  cre-cli:
    don-family: "zone-a"
  rpcs:
    # Audit H-09 / 4626-301: inject Infura project id via ${INFURA_PROJECT_ID} from
    # CRE Secrets rather than committing a placeholder that ships literal text.
    - chain-name: ethereum-mainnet
      url: https://mainnet.infura.io/v3/${INFURA_PROJECT_ID}
    - chain-name: ethereum-mainnet-base-1
      url: https://base-mainnet.infura.io/v3/${INFURA_PROJECT_ID}
