# H-09 (4626-301): long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# were removed 2026-04-23 as part of the Sprint 3 security audit
# remediation. The runtime now exchanges AWS_OIDC_TOKEN for short-lived
# STS credentials via AssumeRoleWithWebIdentity. See
# docs/operations/aws-oidc-setup.md for the matching IAM trust policy,
# the OIDC-provider configuration, and the token-rotation contract.
secretsNames:
  KEEPR_API_KEY:
    - KEEPR_API_KEY_VALUE
  KEEPR_API_BASE_URL:
    - KEEPR_API_BASE_URL_VALUE
  KEEPR_PRIVATE_KEY:
    - KEEPR_PRIVATE_KEY_VALUE
  CRE_RUNTIME_WEBHOOK_HMAC_SECRET:
    - CRE_RUNTIME_WEBHOOK_HMAC_SECRET_VALUE
  # OIDC ID token (JWT) signed by the OIDC provider configured in AWS
  # IAM. The token is short-lived and must be re-issued out-of-band
  # before expiration; operators rotate the *value* behind this mapping,
  # not the mapping itself.
  AWS_OIDC_TOKEN:
    - AWS_OIDC_TOKEN_VALUE
