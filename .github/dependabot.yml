# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8

  - package-ecosystem: "npm"
    directory: "/kpr"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # KPR Chainlink workflows: Bun lockfiles (text `bun.lock`); dirs without a lockfile rely on CI install only.
  - package-ecosystem: "bun"
    directory: "/kpr/kpr-workflows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "bun"
    directory: "/kpr/kpr-workflows/ajna-bucket-manager"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "bun"
    directory: "/kpr/kpr-workflows/cca-finalization"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "bun"
    directory: "/kpr/kpr-workflows/keepr-action-queue"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "bun"
    directory: "/kpr/kpr-workflows/payout-integrity"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "bun"
    directory: "/kpr/kpr-workflows/vault-keeper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
