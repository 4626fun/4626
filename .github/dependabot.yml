# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Cost posture: fewer ecosystems, lower PR limits, monthly where possible.
# Each Dependabot PR can re-trigger CI — keep volume low.

version: 2
updates:
  # Primary app surface
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      root-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/kpr"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      kpr-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Single bun ecosystem for kpr-workflows tree (was 6 separate weekly configs).
  - package-ecosystem: "bun"
    directory: "/kpr/kpr-workflows"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
