name: Protocol Brand Assets

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/public/protocols/**'
      - 'frontend/scripts/verify-protocol-assets.mjs'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/protocol-assets.yml'
  push:
    branches: [main, master]
    paths:
      - 'frontend/public/protocols/**'
      - 'frontend/scripts/verify-protocol-assets.mjs'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/protocol-assets.yml'

jobs:
  verify-protocol-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Verify protocol brand assets
        run: pnpm --dir frontend verify:protocol-assets
