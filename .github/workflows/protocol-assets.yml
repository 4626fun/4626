name: Protocol Brand Assets

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/public/protocols/**'
      - 'frontend/scripts/verify-protocol-assets.mjs'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/protocol-assets.yml'
  push:
    branches: [main, master]
    paths:
      - 'frontend/public/protocols/**'
      - 'frontend/scripts/verify-protocol-assets.mjs'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/protocol-assets.yml'

jobs:
  verify-protocol-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Verify protocol brand assets
        run: pnpm --dir frontend verify:protocol-assets
