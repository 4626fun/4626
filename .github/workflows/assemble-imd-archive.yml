name: assemble-imd-archive
on:
  push:
    branches: [imd-batcher-finalize]
    paths:
      - .github/workflows/assemble-imd-archive.yml
      - .imd-archive-parts/c*.txt
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imd-batcher-finalize
          fetch-depth: 0
      - name: assemble and verify
        run: |
          set -euo pipefail
          cat .imd-archive-parts/c00.txt .imd-archive-parts/c01.txt .imd-archive-parts/c02.txt .imd-archive-parts/c03.txt .imd-archive-parts/c04.txt .imd-archive-parts/c05.txt .imd-archive-parts/c06.txt .imd-archive-parts/c07.txt .imd-archive-parts/c08.txt .imd-archive-parts/c09.txt .imd-archive-parts/c10.txt .imd-archive-parts/c11.txt > IMD_BATCHER_ARCHIVE.b64
          echo "4d2199f77975e66c6c92e4886743cc6a40e8e7ce3a80efe638a67bbb205f6b74  IMD_BATCHER_ARCHIVE.b64" | sha256sum -c -
          test "$(wc -c < IMD_BATCHER_ARCHIVE.b64)" = "93352"
          git add IMD_BATCHER_ARCHIVE.b64
          git diff --cached --quiet && exit 0
          git config user.email "84614986+wenakita@users.noreply.github.com"
          git config user.name "Akita V2"
          git commit -m "Add Phase 1 batcher finalize archive"
          git push origin HEAD:imd-batcher-finalize
