# https://github.com/actions/dependency-review-action
# Requires dependency graph / review API: public repos, or private org repos with GitHub Advanced Security.

name: Dependency Review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency review availability
        id: availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! repo_json="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          )"; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "reason=Could not query repository security settings with the workflow token." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_private="$(jq -r '.private // false' <<<"$repo_json")"
          dependency_graph="$(jq -r '.security_and_analysis.dependency_graph.status // "disabled"' <<<"$repo_json")"
          advanced_security="$(jq -r '.security_and_analysis.advanced_security.status // "disabled"' <<<"$repo_json")"

          supported=false
          reason="Dependency review requires a public repository, or a private repository with Dependency graph and GitHub Advanced Security enabled."

          if [ "$is_private" = "false" ]; then
            supported=true
            reason="Public repositories support dependency review."
          elif [ "$dependency_graph" = "enabled" ] && [ "$advanced_security" = "enabled" ]; then
            supported=true
            reason="Private repository has Dependency graph and GitHub Advanced Security enabled."
          fi

          printf 'supported=%s\n' "$supported" >> "$GITHUB_OUTPUT"
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        if: steps.availability.outputs.supported == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dependency Review
        if: steps.availability.outputs.supported == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          # High+ only; both runtime and dev deps (tooling vulns can affect CI or supply chain).
          fail-on-severity: high
          fail-on-scopes: runtime, development
          license-check: true

      - name: Dependency review unavailable
        if: steps.availability.outputs.supported != 'true'
        run: |
          echo "::notice title=Dependency review skipped::${{ steps.availability.outputs.reason }}"
          echo "## Dependency Review" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skipped: ${{ steps.availability.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Enable support here: https://github.com/${GITHUB_REPOSITORY}/settings/security_analysis" >> "$GITHUB_STEP_SUMMARY"
