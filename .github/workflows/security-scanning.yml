name: Security scanning

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (incremental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks on pull request commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect --source . --config gitleaks.toml --no-banner --verbose --redact \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Run gitleaks on push commits
        if: github.event_name == 'push'
        run: |
          if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            gitleaks detect --source . --config gitleaks.toml --no-banner --verbose --redact \
              --log-opts "${{ github.sha }}^!"
          else
            gitleaks detect --source . --config gitleaks.toml --no-banner --verbose --redact \
              --log-opts "${{ github.event.before }}..${{ github.event.after }}"
          fi

      - name: Run gitleaks (full manual ref)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gitleaks detect --source . --config gitleaks.toml --no-banner --verbose --redact \
            --log-opts "${{ github.sha }}^!"

  dependency-audit:
    name: pnpm audit (blocking on high+critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      # Audit finding M-35 / 4626-344: `pnpm audit` must be blocking.
      # `--audit-level high` exits non-zero only when a high or critical advisory
      # is found; informational/low/moderate advisories continue to appear in the
      # job summary but do not fail CI.
      - name: Root lockfile audit
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high 2>&1 | tee "$RUNNER_TEMP/root-audit.txt"

      - name: Frontend lockfile audit
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend audit --audit-level high 2>&1 | tee "$RUNNER_TEMP/frontend-audit.txt"

      - name: CRE lockfile audit
        run: pnpm --dir cre install --frozen-lockfile && pnpm --dir cre audit --audit-level high 2>&1 | tee "$RUNNER_TEMP/cre-audit.txt"

      - name: Docs site lockfile audit
        run: pnpm --dir apps/docs-site install --frozen-lockfile && pnpm --dir apps/docs-site audit --audit-level high 2>&1 | tee "$RUNNER_TEMP/docs-site-audit.txt"

      - name: Write summary
        if: always()
        run: |
          echo "## pnpm audit (blocking on high+critical)" >> "$GITHUB_STEP_SUMMARY"
          echo "Any high or critical advisory fails the job. Moderate / low / info are surfaced here but do not block." >> "$GITHUB_STEP_SUMMARY"
          echo "### Root (\`pnpm-lock.yaml\`)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 "$RUNNER_TEMP/root-audit.txt" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Frontend (\`frontend/pnpm-lock.yaml\`)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 "$RUNNER_TEMP/frontend-audit.txt" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### CRE (\`cre/pnpm-lock.yaml\`)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 "$RUNNER_TEMP/cre-audit.txt" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Docs site (\`apps/docs-site/pnpm-lock.yaml\`)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 "$RUNNER_TEMP/docs-site-audit.txt" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  semgrep-api:
    name: Semgrep (frontend API surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Pull Semgrep image
        run: docker pull semgrep/semgrep:latest

      - name: Scan API handlers and shared server lib
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" semgrep/semgrep:latest semgrep scan \
            --metrics=off \
            --timeout=5 \
            --config=p/typescript \
            --config=p/javascript \
            /src/frontend/api \
            /src/frontend/server/_lib \
            /src/frontend/packages/server-core/src \
            2>&1 | tee "$RUNNER_TEMP/semgrep.txt"

      - name: Semgrep summary
        if: always()
        run: |
          echo "## Semgrep (blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "Rulesets \`p/typescript\` + \`p/javascript\` on \`frontend/api\`, \`frontend/server/_lib\`, and \`frontend/packages/server-core/src\`. Any finding fails the job." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -200 "$RUNNER_TEMP/semgrep.txt" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no semgrep output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  slither-contracts:
    # Audit findings M-34, M-37 / 4626-343, 4626-346:
    # Slither now fails on high-impact findings on every branch, and
    # `forge build --sizes` is no longer swallowed with `|| true` so
    # contracts that exceed the EIP-170 24 KB limit break CI.
    name: Slither (Foundry, blocking on high impact)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: nightly

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Forge build (EIP-170 size check)
        run: forge build --sizes

      - name: Run Slither (JSON)
        run: slither . --fail-none --json "$RUNNER_TEMP/slither.json" 2>&1 | tee "$RUNNER_TEMP/slither.txt"

      - name: Fail on high-impact Slither findings
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "slither.json")
          with open(path, "r", encoding="utf-8") as f:
            data = json.load(f)
          detectors = ((data or {}).get("results") or {}).get("detectors") or []
          highs = [d for d in detectors if str(d.get("impact", "")).lower() == "high"]
          if highs:
            print("High-impact Slither findings detected:")
            for d in highs:
              print(f"- {d.get('check', '<unknown>')} (impact={d.get('impact')}, confidence={d.get('confidence')})")
            sys.exit(1)
          print("No high-impact Slither findings.")
          PY

      - name: Slither summary
        if: always()
        run: |
          echo "## Slither (blocking on high impact)" >> "$GITHUB_STEP_SUMMARY"
          echo "Full static analysis; any high-impact finding fails the job. Medium/low detectors are surfaced in logs." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 "$RUNNER_TEMP/slither.txt" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no slither output)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  slither-launch-gate:
    name: Slither launch branch gate (high impact)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/launch/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'launch/'))
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: nightly

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Forge build
        run: forge build --sizes || true

      - name: Run Slither (JSON)
        run: slither . --fail-none --json "$RUNNER_TEMP/slither-launch.json"

      - name: Fail launch branch on high-impact findings
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "slither-launch.json")
          with open(path, "r", encoding="utf-8") as f:
            data = json.load(f)
          detectors = ((data or {}).get("results") or {}).get("detectors") or []
          highs = [d for d in detectors if str(d.get("impact", "")).lower() == "high"]
          if highs:
            print("High-impact Slither findings detected on launch branch:")
            for d in highs:
              check = d.get("check", "<unknown-check>")
              impact = d.get("impact", "<impact>")
              confidence = d.get("confidence", "<confidence>")
              print(f"- {check} (impact={impact}, confidence={confidence})")
            sys.exit(1)
          print("No high-impact Slither findings detected.")
          PY
