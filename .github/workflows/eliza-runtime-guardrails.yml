name: Eliza Runtime Guardrails

on:
  pull_request:
    paths:
      - 'frontend/server/agents/eliza/**'
      - 'frontend/server/_lib/privyWalletApi.ts'
      - 'frontend/server/_lib/teeAttestationGate.ts'
      - 'frontend/packages/server-core/**'
      - 'frontend/server/keepr/sendCommand.ts'
      - 'frontend/api/_handlers/v1/agents/identity/_verification.ts'
      - 'frontend/.env.example'
      - 'railway.toml'
      - '.railwayignore'
      - '.github/workflows/eliza-runtime-guardrails.yml'
  workflow_dispatch:

jobs:
  eliza-runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Verify Railway readiness probe is strict
        run: grep -Eq 'healthcheckPath[[:space:]]*=[[:space:]]*"/healthz"' railway.toml

      - name: Verify runtime env contract is documented
        run: |
          grep -Fq 'AGENT_RUNTIME_ROLE=' frontend/.env.example
          grep -Fq 'AGENT_CONSUME_XMTP=' frontend/.env.example
          grep -Fq 'TEE_ENFORCEMENT_ENABLED' frontend/.env.example

      - name: Run Eliza runtime unit guardrails
        run: |
          pnpm --dir frontend exec vitest run \
            server/agents/eliza/__tests__/runtimeBridge.test.ts \
            server/agents/eliza/__tests__/llm.test.ts \
            server/_lib/__tests__/teeAttestationGate.test.ts
