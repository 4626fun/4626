name: CRE Workflows

on:
  pull_request:
    paths:
      - "cre/cre-workflows/**"
      - "frontend/api/_handlers/cre/**"
      - "frontend/api/_handlers/_routes.ts"
      - ".github/workflows/cre-workflows.yml"
  push:
    branches: [main]
    paths:
      - "cre/cre-workflows/**"
      - "frontend/api/_handlers/cre/**"
      - "frontend/api/_handlers/_routes.ts"
      - ".github/workflows/cre-workflows.yml"

permissions:
  contents: read

jobs:
  cre-config-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate CRE workflow structure and config wiring
        run: bash cre/cre-workflows/scripts/validate-workflow-layout.sh

  cre-typecheck-and-tests:
    runs-on: ubuntu-latest
    needs: cre-config-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.42"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"

      - name: Typecheck CRE workflows
        run: bash cre/cre-workflows/scripts/typecheck-workflows.sh

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Run focused API test coverage for strategy build paths
        run: pnpm -C frontend test api/__tests__/v1BuildCharmHandlers.test.ts

  cre-simulation:
    runs-on: ubuntu-latest
    needs: cre-typecheck-and-tests
    if: ${{ vars.CRE_SIMULATION_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.42"

      - name: Run CRE simulation suite (optional)
        env:
          CRE_SIMULATION_ENABLED: "true"
        run: bash cre/cre-workflows/scripts/simulate-workflows.sh

  cre-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan (changed commit range)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          gitleaks_bin="$(go env GOPATH)/bin/gitleaks"
          if [[ "$EVENT_NAME" == "pull_request" && -n "${BASE_SHA:-}" ]]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [[ -n "${BEFORE_SHA:-}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            range=""
          fi

          if [[ -n "$range" ]]; then
            echo "[gitleaks] scanning commit range: $range"
            "$gitleaks_bin" detect --no-banner --redact --log-opts "$range" --exit-code 1
          else
            echo "[gitleaks] scanning repository snapshot (no commit range metadata available)"
            "$gitleaks_bin" detect --no-banner --redact --exit-code 1
          fi
