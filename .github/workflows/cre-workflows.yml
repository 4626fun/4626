name: CRE Workflows

on:
  pull_request:
    paths:
      - "cre/cre-workflows/**"
      - "frontend/api/_handlers/cre/**"
      - "frontend/api/_handlers/_routes.ts"
      - ".github/workflows/cre-workflows.yml"
  push:
    branches: [main]
    paths:
      - "cre/cre-workflows/**"
      - "frontend/api/_handlers/cre/**"
      - "frontend/api/_handlers/_routes.ts"
      - ".github/workflows/cre-workflows.yml"

permissions:
  contents: read

jobs:
  cre-config-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Validate CRE workflow structure and config wiring
        run: bash cre/cre-workflows/scripts/validate-workflow-layout.sh

  cre-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan (changed commit range)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          gitleaks_bin="$(go env GOPATH)/bin/gitleaks"
          if [[ "$EVENT_NAME" == "pull_request" && -n "${BASE_SHA:-}" ]]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [[ -n "${BEFORE_SHA:-}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            range=""
          fi

          if [[ -n "$range" ]]; then
            echo "[gitleaks] scanning commit range: $range"
            "$gitleaks_bin" detect --no-banner --redact --log-opts "$range" --exit-code 1
          else
            echo "[gitleaks] scanning repository snapshot (no commit range metadata available)"
            "$gitleaks_bin" detect --no-banner --redact --exit-code 1
          fi
