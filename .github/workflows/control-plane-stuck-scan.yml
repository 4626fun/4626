name: Control Plane Stuck Scan

# Cost: schedule removed (was */30 → … → weekly). Run from Actions UI when
# investigating stuck deploy/control-plane sessions.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-stuck-scan
  cancel-in-progress: true

# Audit finding H-6 (2026-06): this workflow previously used npm ci against a
# nonexistent frontend/package-lock.json (the repo is pnpm-only), so every
# scheduled run failed at install. Rewritten to the pnpm pattern used by
# test.yml api-tests with SHA-pinned actions.
jobs:
  stuck-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run control-plane stuck scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTROL_PLANE_STUCK_FAIL_ON_FOUND: '1'
          CONTROL_PLANE_ALERT_WEBHOOK_URL: ${{ secrets.CONTROL_PLANE_ALERT_WEBHOOK_URL }}
        run: |
          touch frontend/.env
          pnpm --dir frontend run control-plane:stuck-scan
