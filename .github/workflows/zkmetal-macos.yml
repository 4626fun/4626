# GPU-accelerated AMOE prover & MIT verifier emitter — Apple Silicon CI.
#
# Why this exists:
#   relayer/zkproof and relayer/drand link against zkMetal, which is Metal-only
#   (Apple Silicon, macOS 14+). No Linux runner can build them. GitHub-hosted
#   `macos-15` runners are M-series and free for public repos, so we use them
#   as our reproducible Apple Silicon host instead of asking anyone to run
#   builds on their personal machine.
#
# What it does on every push / PR that touches zkproof or drand:
#   1. Builds relayer/zkproof and relayer/drand in release mode.
#   2. Runs `swift test` for both targets.
#   3. Re-emits AmoeGroth16Verifier.sol via amoe-prover and confirms the
#      regenerated contract verifies the existing AMOE fixture proof in
#      test/zk/AmoeGroth16Verifier.t.sol (when forge is available).
#   4. Diffs the regenerated verifier against the committed copy. If the
#      committed contract drifts from what zkMetal would emit, the diff
#      surfaces in CI logs — non-blocking by default, but easy to flip to
#      blocking once we're confident the emitter output is stable.

name: zkMetal · Apple Silicon

on:
  push:
    branches: [main]
    paths:
      - "relayer/zkproof/**"
      - "relayer/drand/**"
      - "circuits/amoe/build/verification_key.json"
      - "contracts/utilities/lottery/zk/AmoeGroth16Verifier.sol"
      - "tools/zk/emit_amoe_verifier.sh"
      - ".github/workflows/zkmetal-macos.yml"
  pull_request:
    paths:
      - "relayer/zkproof/**"
      - "relayer/drand/**"
      - "circuits/amoe/build/verification_key.json"
      - "contracts/utilities/lottery/zk/AmoeGroth16Verifier.sol"
      - "tools/zk/emit_amoe_verifier.sh"
      - ".github/workflows/zkmetal-macos.yml"
  workflow_dispatch:
    inputs:
      zkmetal_fork_repo:
        description: "zkMetal repo (owner/name) for verify-fork job"
        required: false
        default: "wenakita/zkMetal"
      zkmetal_fork_ref:
        description: "zkMetal ref (branch or SHA) for verify-fork job"
        required: false
        default: "fix/macos-15-swift6"

permissions:
  contents: read

concurrency:
  group: zkmetal-macos-${{ github.ref }}
  # Only cancel in-progress runs for PR updates. Pushes to main must run to
  # completion so required-check signals are not lost when commits land
  # back-to-back.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build & test on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Pin zkMetal to a known-good SHA so an upstream change cannot break
      # our CI overnight. Bump this manually when we want a newer zkMetal.
      #
      # NOTE (2026-04-26): zkMetal `main` currently does not compile cleanly
      # against any Xcode on macos-15 — there are real Swift type errors in
      # `Sources/zkMetal/ECDSA/EdDSAEngine.swift` and
      # `Sources/zkMetal/Fields/MetaField/MetaFieldCircuit.swift`. These are
      # tracked upstream and downstream in the repo issue for H-1/H-3/H-4.
      # Until they are resolved, the swift build/test steps below will fail
      # and the triage step will tolerate them as upstream flakes — the
      # verifier emit + diff steps are gated on a successful zkproof build.
      ZKMETAL_REF: 0ff64e0323ac985bd495ebf0fae09b22a55729d5
      # We pin Xcode alongside ZKMETAL_REF so the toolchain combination is
      # deterministic. If GitHub Actions retires this Xcode image, bump to
      # the next available version on macos-15.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout 4626
        uses: actions/checkout@v4
        with:
          path: fourksixsixtwo

      # zkMetal is a sibling-path dependency in both Package.swift files
      # (`.package(path: "../../../zkmetal")`). Clone it next to the 4626
      # checkout so the relative path resolves.
      - name: Checkout zkMetal
        uses: actions/checkout@v4
        with:
          repository: carni-ships/zkMetal
          ref: ${{ env.ZKMETAL_REF }}
          path: zkmetal

      - name: Select Xcode toolchain
        # `DEVELOPER_DIR` above only takes effect for tools that read it; we
        # use xcode-select so `swift`, `xcrun`, and `swift build` all see the
        # same SDK.
        #
        # If the pinned Xcode is missing, behavior depends on event type:
        #   - push to main: hard-fail. main is what produces required-check
        #     signals and release artifacts; a silent toolchain swap there
        #     defeats the whole point of pinning.
        #   - pull_request / workflow_dispatch: warn and fall back to the
        #     runner default so CI image rotation doesn't block PRs.
        run: |
          if [ -d "$DEVELOPER_DIR" ]; then
            sudo xcode-select -s "$DEVELOPER_DIR"
            echo "Selected: $DEVELOPER_DIR"
          else
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::pinned $DEVELOPER_DIR not found on macos-15 runner"
              echo "::error::refusing to silently fall back on push-to-main; bump DEVELOPER_DIR in this workflow"
              exit 1
            fi
            echo "::warning::pinned $DEVELOPER_DIR not found; using runner default (non-main event)"
            # Re-export the runner's currently-selected developer dir so
            # subsequent steps (and any tool that reads $DEVELOPER_DIR
            # directly, e.g. xcrun) see a consistent value. The later write
            # to $GITHUB_ENV wins, so a single overwrite is sufficient.
            RUNNER_DEVELOPER_DIR="$(xcode-select -p)"
            echo "Falling back to: $RUNNER_DEVELOPER_DIR"
            echo "DEVELOPER_DIR=$RUNNER_DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          uname -a
          echo "zkMetal pinned to: $ZKMETAL_REF"
          (cd zkmetal && git rev-parse HEAD)

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            fourksixsixtwo/relayer/zkproof/.build
            fourksixsixtwo/relayer/drand/.build
            ~/Library/Caches/org.swift.swiftpm
          # Include ZKMETAL_REF in the cache key: zkMetal is a sibling-path
          # SwiftPM dependency, so its source changes are NOT reflected in
          # Package.swift hashes. Without this, bumping ZKMETAL_REF would
          # restore a stale .build cache and silently mask the upgrade.
          key: spm-${{ runner.os }}-${{ env.ZKMETAL_REF }}-${{ hashFiles('fourksixsixtwo/relayer/zkproof/Package.swift', 'fourksixsixtwo/relayer/drand/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.ZKMETAL_REF }}-
            spm-${{ runner.os }}-

      # The build steps below transitively compile zkMetal. When upstream
      # zkMetal trips a Swift type-checker timeout (a recurring issue with
      # complex generic expressions in their Serialization/ subtree), the
      # failure is not in our diff and shouldn't gate this repo's PRs.
      #
      # Triage strategy:
      #   - Run each step with `continue-on-error: true` so we always reach
      #     the triage step below.
      #   - Tee stdout+stderr to a per-step log file.
      #   - The triage step grep's each log: any error/warning reference to
      #     a path *outside* zkmetal/ (i.e. inside fourksixsixtwo/relayer/)
      #     is a first-party regression and FAILS the job. Errors that
      #     reference only zkmetal/ paths (or the SwiftPM checkouts cache)
      #     are tolerated as upstream flakes.
      #
      # This preserves the blocking signal for code in this repo while
      # absorbing transient upstream Swift compiler timeouts.
      - name: Build relayer/zkproof (release)
        id: build-zkproof
        working-directory: fourksixsixtwo/relayer/zkproof
        continue-on-error: true
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee "$RUNNER_TEMP/build-zkproof.log"

      - name: Test relayer/zkproof
        id: test-zkproof
        working-directory: fourksixsixtwo/relayer/zkproof
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee "$RUNNER_TEMP/test-zkproof.log"

      - name: Build relayer/drand (release)
        id: build-drand
        working-directory: fourksixsixtwo/relayer/drand
        continue-on-error: true
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee "$RUNNER_TEMP/build-drand.log"

      - name: Test relayer/drand
        id: test-drand
        working-directory: fourksixsixtwo/relayer/drand
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee "$RUNNER_TEMP/test-drand.log"

      - name: Triage Swift build outcomes (block on first-party regressions)
        id: triage
        run: |
          set -euo pipefail
          echo "build relayer/zkproof: ${{ steps.build-zkproof.outcome }}"
          echo "test relayer/zkproof:  ${{ steps.test-zkproof.outcome }}"
          echo "build relayer/drand:   ${{ steps.build-drand.outcome }}"
          echo "test relayer/drand:    ${{ steps.test-drand.outcome }}"

          if [ "${{ steps.build-zkproof.outcome }}" = "success" ] && \
             [ "${{ steps.test-zkproof.outcome  }}" = "success" ] && \
             [ "${{ steps.build-drand.outcome   }}" = "success" ] && \
             [ "${{ steps.test-drand.outcome    }}" = "success" ]; then
            echo "all swift steps succeeded"
            exit 0
          fi

          # A first-party regression is any error/warning line that points
          # at a source file inside this repo's relayer/ subtree. Anything
          # else (zkMetal sources, SwiftPM checkout cache, /Library/...) is
          # treated as upstream flake.
          #
          # Patterns we look for:
          #   - swift compiler error format: "path/to/file.swift:LINE:COL: error: ..."
          #   - linker errors mentioning relayer/{zkproof,drand} symbols
          #   - XCTest failures: "Test Case '-[Module.Class testName]' failed"
          first_party_failures=0
          for log in "$RUNNER_TEMP"/build-zkproof.log \
                     "$RUNNER_TEMP"/test-zkproof.log \
                     "$RUNNER_TEMP"/build-drand.log \
                     "$RUNNER_TEMP"/test-drand.log; do
            [ -f "$log" ] || continue
            # Compiler/linker errors in our own source tree.
            our_errors=$(grep -E "(^|[ /])(relayer/(zkproof|drand)/Sources/|relayer/(zkproof|drand)/Tests/)[^ ]+\\.swift:[0-9]+:[0-9]+: (error|warning): " "$log" || true)
            # XCTest test-failure lines (these come from running our own tests).
            our_test_fails=$(grep -E "^Test Case .* failed \\(" "$log" || true)
            if [ -n "$our_errors" ] || [ -n "$our_test_fails" ]; then
              echo "::error::first-party regression detected in $(basename "$log")"
              [ -n "$our_errors"     ] && echo "$our_errors"
              [ -n "$our_test_fails" ] && echo "$our_test_fails"
              first_party_failures=$((first_party_failures + 1))
            fi
          done

          if [ "$first_party_failures" -gt 0 ]; then
            echo "::error::Swift build/test reported first-party failures; failing job."
            exit 1
          fi

          echo "::warning::Swift step(s) failed but only upstream zkMetal symbols were referenced; tolerating as upstream flake."
          exit 0

      # The verifier emitter is a pure function of verification_key.json, so
      # we can regenerate AmoeGroth16Verifier.sol on every CI run and diff it
      # against what's checked in. Any drift means somebody hand-edited the
      # contract or the emitter output changed.
      - name: Re-emit AmoeGroth16Verifier.sol via zkMetal
        working-directory: fourksixsixtwo
        # Skip when the upstream Swift build failed — amoe-prover binary
        # won't exist and there is nothing to emit. The diff step below
        # will then have nothing to compare and bail gracefully.
        if: steps.build-zkproof.outcome == 'success'
        run: |
          if [ ! -f circuits/amoe/build/verification_key.json ]; then
            echo "::warning::no verification_key.json checked in — skipping verifier emit"
            exit 0
          fi
          ./tools/zk/emit_amoe_verifier.sh

      - name: Diff regenerated verifier vs. committed copy
        working-directory: fourksixsixtwo
        # Only run when the emit step actually ran AND succeeded. Without
        # this guard, `git diff --exit-code` against an unchanged working
        # tree returns 0 and prints "verifier matches zkMetal-emitted
        # output ✓" — a false-green signal when emit was skipped because
        # the upstream build failed or verification_key.json is missing.
        if: steps.build-zkproof.outcome == 'success'
        run: |
          if [ ! -f contracts/utilities/lottery/zk/AmoeGroth16Verifier.sol ]; then
            echo "no committed AmoeGroth16Verifier.sol — nothing to diff"
            exit 0
          fi
          if [ ! -f circuits/amoe/build/verification_key.json ]; then
            echo "::warning::no verification_key.json — emit was skipped, diff is meaningless"
            exit 0
          fi
          if git diff --exit-code -- contracts/utilities/lottery/zk/AmoeGroth16Verifier.sol; then
            echo "verifier matches zkMetal-emitted output ✓"
          else
            echo "::warning::AmoeGroth16Verifier.sol differs from zkMetal-emitted output"
            echo "If this drift is intentional, document it. Otherwise re-run tools/zk/emit_amoe_verifier.sh and commit."
            # Non-blocking for now. Flip to `exit 1` once we're confident the
            # emitter output is byte-stable across zkMetal versions.
          fi

      # Run forge tests against the regenerated verifier to confirm the
      # existing fixture proof still verifies. macos-15 doesn't ship forge,
      # so we install it explicitly. Gated on a successful emit step — if
      # the verifier wasn't regenerated, there's nothing to verify against.
      - name: Install Foundry
        if: steps.build-zkproof.outcome == 'success'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify fixture proof against regenerated verifier (forge)
        if: steps.build-zkproof.outcome == 'success'
        working-directory: fourksixsixtwo
        run: |
          # No more `command -v forge` guard — if foundry-toolchain failed
          # to install, we want this step to fail loudly rather than silently
          # skip and produce a false-green signal.
          forge test --match-path "test/zk/AmoeGroth16Verifier.t.sol" -vv

      - name: Upload regenerated verifier as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmoeGroth16Verifier-regenerated
          path: fourksixsixtwo/contracts/utilities/lottery/zk/AmoeGroth16Verifier.sol
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Verify-fork job. Manual trigger only (workflow_dispatch).
  #
  # Purpose: build the wenakita/zkMetal fork at fix/macos-15-swift6 directly
  # and via relayer/zkproof, with maximum verbosity, no triage filter, and
  # no continue-on-error on the swift step itself. Captures unfiltered logs
  # as artifacts so we can iterate on Swift 6 / macOS 15 fixes against real
  # compiler output instead of the upstream-blocked main job.
  #
  # Tracked under issue #389 (H-1, H-3, H-4). Delete this job once the fork
  # branch upstreams to carni-ships/zkMetal and ZKMETAL_REF on the main job
  # is bumped past 0ff64e0.
  # ---------------------------------------------------------------------------
  zkmetal-verify-fork:
    name: zkMetal verify-fork (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Inputs default to wenakita/zkMetal @ fix/macos-15-swift6 but can be
      # overridden at dispatch time to test any fork+ref combo.
      ZKMETAL_FORK_REPO: ${{ inputs.zkmetal_fork_repo }}
      ZKMETAL_FORK_REF:  ${{ inputs.zkmetal_fork_ref }}
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout 4626
        uses: actions/checkout@v4
        with:
          path: fourksixsixtwo

      - name: Checkout zkMetal fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ZKMETAL_FORK_REPO }}
          ref: ${{ env.ZKMETAL_FORK_REF }}
          path: zkmetal

      - name: Select Xcode toolchain (best-effort)
        run: |
          if [ -d "$DEVELOPER_DIR" ]; then
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
          xcode-select -p
          swift --version
          sw_vers

      - name: zkMetal fork fingerprint
        run: |
          cd zkmetal
          echo "Fork repo: $ZKMETAL_FORK_REPO"
          echo "Fork ref:  $ZKMETAL_FORK_REF"
          git rev-parse HEAD
          git log -1 --pretty=fuller
          echo "--- file counts ---"
          find Sources -name '*.swift' | wc -l

      - name: Build zkMetal directly (verbose, no filter)
        id: zkm-direct
        continue-on-error: true
        working-directory: zkmetal
        run: |
          set -o pipefail
          swift build -c release -v 2>&1 | tee "$RUNNER_TEMP/zkm-direct.log"

      - name: Build relayer/zkproof (verbose, no filter)
        id: zkproof-direct
        continue-on-error: true
        working-directory: fourksixsixtwo/relayer/zkproof
        run: |
          set -o pipefail
          swift build -c release -v 2>&1 | tee "$RUNNER_TEMP/zkproof-direct.log"

      - name: Build relayer/drand (verbose, no filter)
        id: drand-direct
        continue-on-error: true
        working-directory: fourksixsixtwo/relayer/drand
        run: |
          set -o pipefail
          swift build -c release -v 2>&1 | tee "$RUNNER_TEMP/drand-direct.log"

      - name: Extract first-class error/warning summary
        if: always()
        run: |
          echo "=== zkMetal direct outcome: ${{ steps.zkm-direct.outcome }} ==="
          echo "=== zkproof outcome:        ${{ steps.zkproof-direct.outcome }} ==="
          echo "=== drand outcome:          ${{ steps.drand-direct.outcome }} ==="
          echo
          for log in "$RUNNER_TEMP"/zkm-direct.log \
                     "$RUNNER_TEMP"/zkproof-direct.log \
                     "$RUNNER_TEMP"/drand-direct.log; do
            [ -f "$log" ] || continue
            echo "================================================================"
            echo "== $(basename "$log") errors/warnings"
            echo "================================================================"
            grep -E '\.swift:[0-9]+:[0-9]+: (error|warning|note):' "$log" || echo "(none matched)"
            echo
            echo "-- last 80 lines --"
            tail -n 80 "$log"
            echo
          done

      - name: Fail job on any direct build error
        # We do want this job to RED when there are still errors anywhere in
        # the stack we're verifying — fork iteration needs an honest
        # red/green signal. The triage filter (which excludes known
        # first-party drift on the main job) is intentionally NOT applied
        # here: a relayer/zkproof or relayer/drand failure under the fork
        # is a real regression for this PR's purposes and must turn the
        # job red. Previously this gate only checked zkm-direct, which
        # let downstream regressions slip through as green.
        if: |
          steps.zkm-direct.outcome == 'failure' ||
          steps.zkproof-direct.outcome == 'failure' ||
          steps.drand-direct.outcome == 'failure'
        run: |
          echo "::error::Direct build failed against fork $ZKMETAL_FORK_REPO@$ZKMETAL_FORK_REF"
          echo "  zkMetal direct:   ${{ steps.zkm-direct.outcome }}"
          echo "  relayer/zkproof:  ${{ steps.zkproof-direct.outcome }}"
          echo "  relayer/drand:    ${{ steps.drand-direct.outcome }}"
          exit 1

      - name: Upload full unfiltered build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zkmetal-fork-verbose-logs
          path: |
            ${{ runner.temp }}/zkm-direct.log
            ${{ runner.temp }}/zkproof-direct.log
            ${{ runner.temp }}/drand-direct.log
          if-no-files-found: error
          retention-days: 30
