name: Deploy AlfaClub Proxy Worker

# Manual CD only — auto-push was chronically red (missing Cloudflare secrets)
# and burned Actions minutes on every proxy-path merge. Deploy from the
# Actions UI after secrets are set (or use wrangler locally).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-alfaclub-proxy-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: alfaclub/infra/cloudflare-proxy
          command: deploy
