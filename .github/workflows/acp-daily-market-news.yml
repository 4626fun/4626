name: ACP Market News (manual)

# Cost: was 2× daily schedule. Run from Actions UI when product needs a brief;
# re-enable schedule only if ACP market-news is production-critical again.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Run slot"
        type: choice
        required: false
        default: "morning"
        options:
          - morning
          - checkpoint
      dry_run:
        description: "Skip onchain create/fund actions"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: acp-daily-market-news
  cancel-in-progress: false

jobs:
  run:
    name: Run ACP market-news slot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Install ACP CLI
        # M2-14 — pin CLI version (not floating latest).
        run: npm i -g @virtuals-protocol/acp-cli@1.0.24

      - name: Resolve slot
        id: resolve
        env:
          DISPATCH_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
          DISPATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '' }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${DISPATCH_SLOT}" in
              morning|checkpoint)
                SLOT="${DISPATCH_SLOT}"
                ;;
              "")
                SLOT="morning"
                ;;
              *)
                echo "Invalid slot input: ${DISPATCH_SLOT}" >&2
                exit 1
                ;;
            esac

            case "${DISPATCH_DRY_RUN}" in
              true|false)
                DRY="${DISPATCH_DRY_RUN}"
                ;;
              "")
                DRY="false"
                ;;
              *)
                echo "Invalid dry_run input: ${DISPATCH_DRY_RUN}" >&2
                exit 1
                ;;
            esac
          else
            HOUR="$(date -u +%H)"
            if [[ "$HOUR" == "07" ]]; then
              SLOT="morning"
            else
              SLOT="checkpoint"
            fi
            DRY="false"
          fi
          printf 'slot=%s\n' "$SLOT" >> "$GITHUB_OUTPUT"
          printf 'dry=%s\n' "$DRY" >> "$GITHUB_OUTPUT"

      - name: Run ACP daily market-news runner
        env:
          ACP_ACCESS_TOKEN: ${{ secrets.ACP_ACCESS_TOKEN }}
          ACP_REFRESH_TOKEN: ${{ secrets.ACP_REFRESH_TOKEN }}
          ACP_OWNER_WALLET: ${{ secrets.ACP_OWNER_WALLET }}
          ACP_CLIENT_AGENT_ID: ${{ secrets.ACP_CLIENT_AGENT_ID }}
          ACP_CHAIN_ID: ${{ vars.ACP_CHAIN_ID }}
          OTTO_PROVIDER: ${{ vars.ACP_OTTO_PROVIDER }}
          OTTO_OFFERING: ${{ vars.ACP_OTTO_OFFERING }}
          OTTO_REQUIREMENTS_JSON: ${{ vars.ACP_OTTO_REQUIREMENTS_JSON }}
          OTTO_FUND_AMOUNT: ${{ vars.ACP_OTTO_FUND_AMOUNT }}
          PULSE_PROVIDER: ${{ vars.ACP_PULSE_PROVIDER }}
          PULSE_OFFERING: ${{ vars.ACP_PULSE_OFFERING }}
          PULSE_REQUIREMENTS_JSON: ${{ vars.ACP_PULSE_REQUIREMENTS_JSON }}
          PULSE_FUND_AMOUNT: ${{ vars.ACP_PULSE_FUND_AMOUNT }}
          FUND_CHECK_TIMEOUT_SECONDS: ${{ vars.ACP_FUND_CHECK_TIMEOUT_SECONDS }}
          FUND_CHECK_INTERVAL_SECONDS: ${{ vars.ACP_FUND_CHECK_INTERVAL_SECONDS }}
          RESOLVED_SLOT: ${{ steps.resolve.outputs.slot }}
          RESOLVED_DRY_RUN: ${{ steps.resolve.outputs.dry }}
        shell: bash
        run: |
          EXTRA_ARGS=()
          case "${RESOLVED_DRY_RUN}" in
            true)
              EXTRA_ARGS+=(--dry-run)
              ;;
            false)
              ;;
            *)
              echo "Invalid resolved dry_run value: ${RESOLVED_DRY_RUN}" >&2
              exit 1
              ;;
          esac

          case "${RESOLVED_SLOT}" in
            morning|checkpoint)
              ;;
            *)
              echo "Invalid resolved slot value: ${RESOLVED_SLOT}" >&2
              exit 1
              ;;
          esac

          scripts/ops/acp-daily-market-news-runner.sh --slot "${RESOLVED_SLOT}" "${EXTRA_ARGS[@]}"
