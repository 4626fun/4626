name: Tests

# Cost posture (2026-07): path-filtered jobs, cancel-in-progress, no duplicate full-forge
# suites, frontend jobs skip Foundry submodules. Full forge on main push still runs
# (minus known-failing Rebalance economic suite — see AGENTS.md).

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/docs-site/**'
      - '**/*.mdx'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/docs-site/**'
      - '**/*.mdx'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FOUNDRY_PROFILE: ci
  MARKETING_ORIGIN: https://4626.fun
  APP_ORIGIN: https://app.4626.fun

jobs:
  # Single detect job (was changes + plan — two runners for one boolean matrix).
  plan:
    name: Detect paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.out.outputs.contracts }}
      frontend: ${{ steps.out.outputs.frontend }}
      kpr: ${{ steps.out.outputs.kpr }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Force-all on main push or dispatch
        id: force
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "force_all=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; }; then
            echo "force_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_all=false" >> "$GITHUB_OUTPUT"
          fi

      # paths-filter uses the PR base via GitHub API when fetch-depth is shallow.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: steps.force.outputs.force_all != 'true'
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'test/**'
              - 'script/**'
              - 'foundry.toml'
              - 'remappings.txt'
              - 'lib/**'
              - 'amoe/tools/ci/**'
              - 'scripts/check-lane-contract-parity.mjs'
              - 'scripts/check-ovault-*.mjs'
              - 'scripts/check-forbidden-tracked-files.sh'
              - 'scripts/check-eip170-size-gate.mjs'
              - '.github/workflows/test.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/test.yml'
            kpr:
              - 'kpr/**'
              - 'scripts/check-vault-strategy-reallocator-wiring.mjs'
              - '.github/workflows/test.yml'

      - name: Resolve outputs
        id: out
        run: |
          if [ "${{ steps.force.outputs.force_all }}" = "true" ]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "kpr=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=${{ steps.filter.outputs.contracts }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "kpr=${{ steps.filter.outputs.kpr }}" >> "$GITHUB_OUTPUT"
          fi

  forge:
    name: Forge (contracts)
    needs: plan
    if: |
      needs.plan.outputs.contracts == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Guard forbidden tracked secrets/key files
        run: bash scripts/check-forbidden-tracked-files.sh

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: v1.7.0

      - name: EIP-170 size gate (allowlist-aware)
        # Blocking for new oversize; known OFT/oracle/Charm factory debt is
        # allowlisted with maxRuntimeBytes ceilings. See
        # docs/operations/contract-size-gate.md and
        # scripts/check-eip170-size-gate.mjs.
        run: node scripts/check-eip170-size-gate.mjs
        id: build

      - name: LotteryManager4626 size warn-guard
        run: amoe/tools/ci/check_manager_size_warn.sh
        id: manager_size_warn
        continue-on-error: true

      - name: Guard agent/creator lane contract parity
        run: |
          node scripts/check-lane-contract-parity.mjs --self-test
          node scripts/check-lane-contract-parity.mjs

      - name: Guard CreatorOVault delegate-epilogue invariant
        run: node scripts/check-ovault-delegate-epilogues.mjs

      - name: Guard CreatorOVault module storage layout parity + versioning
        run: node scripts/check-ovault-module-storage-layout.mjs

      - name: CreatorOVault size warn/fail gate
        run: amoe/tools/ci/check_ovault_size_warn.sh

      - name: Run Forge tests (exclude known Rebalance economic baseline fails)
        # AGENTS.md: CreatorOVaultStrategies.Rebalance.* has pre-existing
        # deterministic failures on main — do not pay minutes re-failing them on every PR.
        run: |
          forge test -vv \
            --no-match-path 'test/vault/strategies/CreatorOVaultStrategies.Rebalance.*'
        id: test

  api-tests:
    name: Frontend guards + typecheck (+ vitest on main)
    needs: plan
    # Skip entire job for draft PRs (still pay path-detect only).
    if: |
      (needs.plan.outputs.frontend == 'true' || needs.plan.outputs.kpr == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # No Foundry submodules — largest checkout cost on monorepo
          fetch-depth: 1

      - name: Guard forbidden tracked secrets/key files
        run: bash scripts/check-forbidden-tracked-files.sh

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            kpr/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Guard server-core boundary for API runtime
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:server-core-boundary

      - name: Guard frontend boundaries (ui/features/api-to-src)
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:frontend-boundaries

      - name: Guard no raw schema DDL
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:schema

      - name: Guard canonical CSW env and legacy address regressions
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:canonical-csw

      - name: Guard output contract stability
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:output-contract

      - name: Frontend ESLint
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend lint

      - name: No TODO/FIXME markers (first-party)
        if: needs.plan.outputs.frontend == 'true'
        run: bash frontend/scripts/check-no-todo-markers.sh

      - name: Guard generated output remains untracked
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:generated-output

      - name: Guard runtime boundaries
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:runtime-boundaries

      - name: Guard mutating API body-size caps
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:api-readjsonbody-maxbytes

      - name: Guard non-v1 429 retry headers and req.body fallback bypasses
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:api-nonv1-hardening

      - name: Guard new test file placement
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend guard:test-file-placement

      - name: Frontend TypeScript
        if: needs.plan.outputs.frontend == 'true'
        run: pnpm --dir frontend typecheck

      - name: Install kpr dependencies
        if: needs.plan.outputs.kpr == 'true' || needs.plan.outputs.frontend == 'true'
        run: pnpm --dir kpr install --frozen-lockfile

      - name: KPR TypeScript (no-regression launch gate)
        if: needs.plan.outputs.kpr == 'true' || needs.plan.outputs.frontend == 'true'
        run: pnpm --dir kpr typecheck

      # Full vitest suite is expensive (~minutes). PR = lint/typecheck/guards only;
      # main push + workflow_dispatch run the full suite.
      - name: Run frontend tests (main / manual only)
        if: |
          needs.plan.outputs.frontend == 'true' && (
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
          )
        run: pnpm --dir frontend test -- --reporter=dot
        env:
          AUTH_SESSION_SECRET: test-auth-session-secret-123456
          DEPLOY_SESSION_TOKEN_HMAC_SECRET: test-deploy-hmac-secret-123456
          APP_ORIGIN: ${{ env.APP_ORIGIN }}
          MARKETING_ORIGIN: ${{ env.MARKETING_ORIGIN }}
          CANONICAL_ORIGIN: ${{ env.MARKETING_ORIGIN }}

      - name: Frontend footprint summary
        if: |
          always() && needs.plan.outputs.frontend == 'true' && (
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
          )
        run: pnpm --dir frontend report:footprint

      - name: Verify production agent registration endpoint
        if: needs.plan.outputs.frontend == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: pnpm --dir frontend check:agent-registration
        env:
          AGENT_REGISTRATION_URL: ${{ env.APP_ORIGIN }}/.well-known/agent-registration.json
          AGENT_REGISTRATION_EXPECTED_ID: '2205'
          AGENT_REGISTRATION_EXPECTED_REGISTRY: eip155:8453:0x8004a169fb4a3325136eb29fa0ceb6d2e539a432

  strategy-reallocator-guards:
    name: Strategy reallocator (KPR only)
    needs: plan
    # Only when kpr/ changes — not every contracts PR. No Foundry (Rebalance suite is known-red).
    if: |
      needs.plan.outputs.kpr == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            kpr/pnpm-lock.yaml

      - name: Install root dependencies (for wiring script if needed)
        run: pnpm install --frozen-lockfile

      - name: Install KPR dependencies
        run: pnpm -C kpr install --frozen-lockfile

      - name: Guard vault strategy reallocator wiring
        run: node scripts/check-vault-strategy-reallocator-wiring.mjs

      - name: KPR planner + pass-loop tests
        run: |
          pnpm -C kpr test vault-strategy-reallocator
          pnpm -C kpr test vault-strategy-reallocator-pass-loop
          pnpm -C kpr test strategyAllocation.fuzz
