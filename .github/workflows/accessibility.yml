name: Accessibility

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:

# Non-blocking until the team sets repository variable A11Y_CI_BLOCKING=true
# (or removes continue-on-error below). See frontend/docs/accessibility.md.

concurrency:
  group: a11y-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  A11Y_CI_BLOCKING: ${{ vars.A11Y_CI_BLOCKING || 'false' }}

jobs:
  a11y-lint:
    name: jsx-a11y ESLint
    # Skip drafts; skip Dependabot (Dependency Review already covers lockfile PRs).
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.A11Y_CI_BLOCKING != 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: jsx-a11y ESLint (error)
        run: pnpm --dir frontend lint:a11y

  # Playwright + axe is expensive (browser install + Vite). Main / manual only.
  a11y-smoke:
    name: axe smoke (Playwright)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.A11Y_CI_BLOCKING != 'true' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install chromium --with-deps

      - name: axe smoke (local Vite)
        run: pnpm --dir frontend smoke:a11y -- --serve
        env:
          A11Y_SERVE_TIMEOUT_MS: '180000'

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Accessibility smoke"
            echo ""
            echo "- \`smoke:a11y\` — axe serious/critical on marketing + app shells"
            echo "- Runs on **main / manual** only (PR uses jsx-a11y lint job)"
          } >> "$GITHUB_STEP_SUMMARY"
