name: Accessibility

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Non-blocking until the team sets repository variable A11Y_CI_BLOCKING=true
# (or removes continue-on-error below). See frontend/docs/accessibility.md.

env:
  A11Y_CI_BLOCKING: ${{ vars.A11Y_CI_BLOCKING || 'false' }}

jobs:
  a11y:
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.A11Y_CI_BLOCKING != 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install chromium --with-deps

      - name: jsx-a11y ESLint (error)
        run: pnpm --dir frontend lint:a11y

      - name: axe smoke (local Vite)
        run: pnpm --dir frontend smoke:a11y -- --serve
        env:
          A11Y_SERVE_TIMEOUT_MS: '180000'

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Accessibility"
            echo ""
            echo "- \`lint:a11y\` — jsx-a11y rules at **error** (see \`frontend/eslint.config.js\`)"
            echo "- \`smoke:a11y\` — axe serious/critical on \`/faq\`, \`/faq/how-it-works\`, \`/waitlist\`, \`/swap\` (marketing + app Vite shells)"
            echo ""
            if [ "${{ env.A11Y_CI_BLOCKING }}" = "true" ]; then
              echo "This job is **blocking** (\`A11Y_CI_BLOCKING=true\`)."
            else
              echo "This job is **non-blocking**. Set repo variable \`A11Y_CI_BLOCKING=true\` to fail PRs on regressions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
