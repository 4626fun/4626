name: AlfaClub auth-health monitor

# External health probe for the AlfaClub Privy/JWT bridge.
#
# Cost: schedule removed (was */5 → … → weekly). Prefer an external uptime
# monitor or Vercel cron for continuous probing; use Actions UI after incidents.
#
# Local:
#   ALFACLUB_HEALTH_CRON_SECRET=… node frontend/scripts/alfaclub-auth-health-monitor.mjs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alfaclub-auth-health-monitor
  cancel-in-progress: true

jobs:
  probe:
    name: Probe /api/v1/alfaclub/chat-auth-health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Run health monitor
        env:
          ALFACLUB_HEALTH_CRON_SECRET: ${{ secrets.ALFACLUB_HEALTH_CRON_SECRET }}
          ALFACLUB_HEALTH_URL: ${{ vars.ALFACLUB_HEALTH_URL }}
        run: node frontend/scripts/alfaclub-auth-health-monitor.mjs
