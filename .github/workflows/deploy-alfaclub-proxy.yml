name: Deploy AlfaClub Proxy Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-workers/alfaclub-proxy/**"
      - ".github/workflows/deploy-alfaclub-proxy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-alfaclub-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare-workers/alfaclub-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: cloudflare-workers/alfaclub-proxy/pnpm-lock.yaml
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
      - name: Verify required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
