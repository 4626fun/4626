name: Docs Drift

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'deployments/**'
      - 'frontend/docs/**'
      - 'frontend/src/**'
      - 'frontend/api/**'
      - 'frontend/server/**'
      - 'frontend/scripts/**'
      - 'script/agent-runtime/skills/**'
      - 'frontend/packages/server-core/**'
      - 'frontend/package.json'
      - 'frontend/typedoc.json'
      - 'frontend/tsconfig.docs.json'
      - 'frontend/README.md'
      - 'apps/docs-site/**'
      - 'src/**'
      - 'contracts/**'
      - 'foundry.toml'
      - 'package.json'
      # Root-level configs scanned by scripts/check-docs-source-link-pin.mjs.
      - 'tsconfig.json'
      - 'tsconfig*.json'
      - 'typedoc.json'
      - 'typedoc*.json'
      # Any change to the docs pipeline / guards themselves must rerun this
      # workflow so CI coverage matches the code that enforces it.
      - 'scripts/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'deployments/**'
      - 'frontend/docs/**'
      - 'frontend/src/**'
      - 'frontend/api/**'
      - 'frontend/server/**'
      - 'frontend/scripts/**'
      - 'script/agent-runtime/skills/**'
      - 'frontend/packages/server-core/**'
      - 'frontend/package.json'
      - 'frontend/typedoc.json'
      - 'frontend/tsconfig.docs.json'
      - 'frontend/README.md'
      - 'apps/docs-site/**'
      - 'src/**'
      - 'contracts/**'
      - 'foundry.toml'
      - 'package.json'
      # Root-level configs scanned by scripts/check-docs-source-link-pin.mjs.
      - 'tsconfig.json'
      - 'tsconfig*.json'
      - 'typedoc.json'
      - 'typedoc*.json'
      # Any change to the docs pipeline / guards themselves must rerun this
      # workflow so CI coverage matches the code that enforces it.
      - 'scripts/**'
      - '.github/workflows/docs.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect docs-sensitive changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            export BASE_SHA="${{ github.event.before }}"
          fi
          node apps/docs-site/scripts/check-docs-drift.mjs --github-output

      - name: Install pnpm
        if: steps.detect.outputs.docs_sensitive == 'true'
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        if: steps.detect.outputs.docs_sensitive == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            apps/docs-site/pnpm-lock.yaml

      - name: Verify curated publish allowlist
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: node apps/docs-site/scripts/check-curated-allowlist.mjs

      - name: Verify docs match onchain contract facts
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: node apps/docs-site/scripts/check-docs-contract-facts.mjs

      - name: Verify authored docs links
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: node apps/docs-site/scripts/check-doc-links.mjs

      - name: Verify docs source coverage
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: node apps/docs-site/scripts/check-docs-source-coverage.mjs

      - name: Audit docs hygiene (staleness gate)
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: |
          node apps/docs-site/scripts/audit-docs-hygiene.mjs --json > /tmp/docs-hygiene.json
          node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('/tmp/docs-hygiene.json','utf8')); console.log('[docs] duplicate paragraph groups:', r.duplicateParagraphGroupCount); console.log('[docs] stale files:', r.staleFileCount); if (r.staleFileCount > 0) process.exit(1);"

      - name: Verify docs source-link pin (no hardcoded refs)
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: node scripts/check-docs-source-link-pin.mjs

      - name: Run docs release-branch ref e2e test
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: node apps/docs-site/scripts/__tests__/source-link-ref-e2e.test.mjs

      - name: Install root dependencies
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install docs-site dependencies
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: pnpm --dir apps/docs-site install --frozen-lockfile

      - name: Install Foundry
        if: steps.detect.outputs.docs_sensitive == 'true' && steps.detect.outputs.contract_docs_sensitive == 'true'
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          version: v1.7.0

      - name: Regenerate docs
        if: steps.detect.outputs.docs_sensitive == 'true'
        run: |
          if [ "${{ steps.detect.outputs.contract_docs_sensitive }}" = "true" ]; then
            pnpm docs:check
          else
            pnpm docs:check -- --skip-contract-docs
          fi

      - name: Summarize docs audit
        if: always()
        run: |
          echo "## Docs Drift Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docs-sensitive changes: ${{ steps.detect.outputs.docs_sensitive || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manual docs touched: ${{ steps.detect.outputs.manual_docs_touched || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generated docs touched: ${{ steps.detect.outputs.generated_docs_touched || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docs tooling touched: ${{ steps.detect.outputs.docs_tooling_touched || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract docs sensitive: ${{ steps.detect.outputs.contract_docs_sensitive || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/docs-hygiene.json ]; then
            node -e "const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync('/tmp/docs-hygiene.json','utf8')); console.log('- Duplicate paragraph groups: ' + r.duplicateParagraphGroupCount); console.log('- Stale docs (> ' + r.staleThresholdDays + 'd): ' + r.staleFileCount);" >> "$GITHUB_STEP_SUMMARY"
          fi
