    <meta charset="UTF-8" />
    <!-- Single PNG favicon stack — avoids Base App flicker from SVG/mask-icon/manifest conflicts. -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{FAVICON_32_PATH}}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{APPLE_TOUCH_ICON_PATH}}" />
    <meta name="msapplication-TileColor" content="{{MS_TILE_COLOR}}" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="{{APP_BASE_URL_TRAILING}}" />
    <title>{{SITE_TITLE}}</title>
    <meta name="application-name" content="{{SITE_APP_NAME}}" />
    <meta name="apple-mobile-web-app-title" content="{{SITE_APP_NAME}}" />
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta name="keywords" content="{{SITE_KEYWORDS}}" />
    <meta name="author" content="{{SITE_AUTHOR}}" />
    <!-- Robots: default noindex until SSR/prerender is available for crawlable routes -->
    <meta name="robots" content="noindex, follow" />
    <!-- Open Graph baseline (overridden per-page by PageMeta component) -->
    <meta property="og:type" content="website" />
