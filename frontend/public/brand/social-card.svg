<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="cv-stroke" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6DCE8" />
      <stop offset="45%" stop-color="#8492B0" />
      <stop offset="80%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#0033CC" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D6DCE8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A" />
  
  <!-- Logo mark -->
  <rect
    x="100"
    y="190"
    width="250"
    height="250"
    rx="40"
    fill="none"
    stroke="url(#cv-stroke)"
    stroke-width="16"
    stroke-linejoin="round"
  />
  
  <!-- Title -->
  <text x="400" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="url(#text-gradient)">
    4626
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#8492B0">
    Documentation
  </text>
  
  <!-- Tagline -->
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#666666">
    ERC-4626 tokenized creator vaults
  </text>
</svg>
