<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">4626.fun logo</title>
  <desc id="desc">Single-color geometric "4" silhouette for Safari pinned tabs. Safari recolors via the mask-icon color attribute.</desc>
  <!-- Safari pinned-tab icons must be a single-color black silhouette on a
       transparent background. Safari then re-tints the entire visible
       fill using the color="..." attribute on the <link rel="mask-icon">.
       Therefore: NO background rect, all paths in solid #000. -->
  <g fill="#000000">
    <rect x="330" y="281" width="121" height="330" rx="20"/>
    <rect x="330" y="505" width="377" height="106" rx="20"/>
    <rect x="586" y="281" width="121" height="474" rx="20"/>
  </g>
</svg>
