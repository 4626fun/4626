    <script>
      ;(() => {
        const WALLET_NOISE_PATTERNS = [
          /Cannot set property ethereum of #<Window> which has only a getter/i,
          /Cannot redefine property:\s*ethereum/i,
          /Failed to add embedded wallet connector:\s*Wallet proxy not initialized/i,
        ]

        const isLockedDescriptor = (descriptor) => {
          if (!descriptor) return false
          if (typeof descriptor.get === 'function' && typeof descriptor.set !== 'function') return true
          if (Object.prototype.hasOwnProperty.call(descriptor, 'writable') && descriptor.writable === false) return true
          return false
        }

        const stabilizeEthereumSlot = () => {
          const ownDescriptor = Object.getOwnPropertyDescriptor(window, 'ethereum')
          if (ownDescriptor && !isLockedDescriptor(ownDescriptor)) return
          if (ownDescriptor && ownDescriptor.configurable !== true) return

          let inheritedDescriptor = null
          if (!ownDescriptor) {
            let cursor = window
            while (cursor) {
              const descriptor = Object.getOwnPropertyDescriptor(cursor, 'ethereum')
              if (descriptor) {
                inheritedDescriptor = descriptor
                break
              }
              cursor = Object.getPrototypeOf(cursor)
            }
          }

          const lockedOwn = isLockedDescriptor(ownDescriptor)
          const lockedInherited = isLockedDescriptor(inheritedDescriptor)
          if (!lockedOwn && !lockedInherited) return

          let currentProvider
          try {
            currentProvider = window.ethereum
          } catch {
            currentProvider = undefined
          }

          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            writable: true,
            value: currentProvider,
          })
        }

        const shouldSuppress = (message, source) => {
          const msg = String(message || '')
          const src = String(source || '').toLowerCase()
          if (WALLET_NOISE_PATTERNS.some((pattern) => pattern.test(msg))) return true
          if (src.includes('requestprovider.js') && msg.toLowerCase().includes('ethereum')) return true
          return false
        }

        try {
          stabilizeEthereumSlot()
        } catch {
          // ignore
        }

        window.addEventListener(
          'error',
          (event) => {
            if (shouldSuppress(event.message, event.filename)) event.preventDefault()
          },
          true,
        )

        window.addEventListener(
          'unhandledrejection',
          (event) => {
            const reason = event.reason
            const message = reason instanceof Error ? reason.message : String(reason?.message ?? reason ?? '')
            if (shouldSuppress(message, '')) event.preventDefault()
          },
          true,
        )
      })()
    </script>
    <script>
      ;(() => {
        // Theme bootstrap (pre-hydration) to avoid flash.
        // Values: "light" | "dark" | "system"
        const KEY = 'cv:theme'
        const saved = (() => {
          try {
            return String(window.localStorage.getItem(KEY) || '').trim()
          } catch {
            return ''
          }
        })()
        const wantsSystem = !saved || saved === 'system'
        const systemDark = (() => {
          try {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          } catch {
            return true
          }
        })()
        const isDark = saved === 'dark' || (wantsSystem && systemDark)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
      })()
    </script>
    <script>
      ;(() => {
        // Keep stale-chunk cache-busting internal and remove internal-only params from the visible URL.
        try {
          const INTERNAL_QUERY_KEYS = new Set(['_r'])
          const INTERNAL_QUERY_PREFIXES = ['_cv_', '__cv_']
          const cleanUrl = new URL(window.location.href)
          let changed = false
          for (const key of [...cleanUrl.searchParams.keys()]) {
            const isInternal =
              INTERNAL_QUERY_KEYS.has(key) || INTERNAL_QUERY_PREFIXES.some((prefix) => key.startsWith(prefix))
            if (!isInternal) continue
            cleanUrl.searchParams.delete(key)
            changed = true
          }
          if (changed) {
            const nextPath = `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`
            window.history.replaceState(window.history.state, '', nextPath)
          }
        } catch {
          // ignore
        }

        // Stale-chunk recovery:
        // When a user has an old cached HTML that references old hashed assets, module imports can fail with
        // "Expected a JavaScript module but got text/html" (because the SPA fallback serves index.html).
        // Reload once with a cache-buster so the browser fetches the latest HTML + asset graph.
        const host = window.location.hostname
        if (host === 'localhost' || host === '127.0.0.1') return

        const KEY = 'cv:reload-on-chunk-fail:v1'
        function reloadOnce() {
          try {
            if (sessionStorage.getItem(KEY)) return
            sessionStorage.setItem(KEY, '1')
          } catch {
            // ignore
          }

          try {
            const url = new URL(window.location.href)
            url.searchParams.set('_r', Date.now().toString(36))
            window.location.replace(url.toString())
          } catch {
            window.location.reload()
          }
        }

        // Vite dispatches this event when modulepreload fails.
        window.addEventListener('vite:preloadError', () => reloadOnce())

        // Generic safety net for browsers that don't emit the preload event.
        window.addEventListener('unhandledrejection', (event) => {
          const msg = String((event && event.reason && (event.reason.message || event.reason)) || '')
          if (
            msg.includes('Failed to fetch dynamically imported module') ||
            msg.includes('Importing a module script failed') ||
            msg.includes('Expected a JavaScript-or-Wasm module script')
          ) {
            reloadOnce()
          }
        })
      })()
    </script>
