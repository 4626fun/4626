<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>4626 Hero Vault — 3D Demo</title>
    <link rel="stylesheet" href="demo.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main class="scene">
      <video class="scene__bg" autoplay loop muted playsinline poster="../hero-scene/assets/landscape.jpg">
        <source src="../hero-scene/assets/hero_loop.mp4" type="video/mp4" />
      </video>
      <div class="scene__halo" aria-hidden="true"></div>
      <div id="vault-canvas" class="scene__cube" aria-hidden="true"></div>
      <p class="scene__label">4626.fun hero vault (local demo)</p>
    </main>
    <script type="module" src="./vault.js"></script>
    <script>
      // Simulate homepage lightning flashes so emissive seams react.
      setInterval(() => {
        window.dispatchEvent(new CustomEvent('vault:lightning', {
          detail: { intensity: 0.6 + Math.random() * 1.1 },
        }));
      }, 3200);
    </script>
  </body>
</html>
