# --------------------------------------------------------------------------
# Railway deployment config — XMTP Agent (Keepr)
# --------------------------------------------------------------------------
# Deploy: `railway up` from the repo root
# Docs: https://docs.railway.com/reference/config-as-code
# --------------------------------------------------------------------------

[build]
# Use the agent-specific Dockerfile (not the full frontend)
dockerfilePath = "frontend/Dockerfile.agent"
watchPatterns = [
  "/frontend/Dockerfile.agent",
  "/frontend/server/**",
  "/frontend/api/**",
  "/frontend/src/config/**",
  "/frontend/src/wallet/**",
  "/frontend/package.json",
  "/frontend/pnpm-lock.yaml",
  "/frontend/tsconfig.json",
  "/frontend/tsconfig.node.json",
  "/patches/**",
  "/frontend/shared/**",
  "/railway.toml"
]

[deploy]
# Number of replicas (only 1 — this repo assumes a single Railway primary)
numReplicas = 1

# Health check: worker-style runtime (no user HTTP traffic), so use liveness
# to avoid deploy flaps during long XMTP cold starts / installation sync.
healthcheckPath = "/healthz"
# XMTP cold starts + first-run installation sync can exceed 2 minutes.
# Keep a generous warmup window for first-run XMTP initialization.
healthcheckTimeout = 300

# Restart on failure
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Start command intentionally omitted so Railway uses Dockerfile CMD.
# Docker CMD runs eliza/bootstrap.ts (health listener before heavy imports).

# Persistent volume for XMTP local database.
# CRITICAL: Without this, every deploy creates a new XMTP installation
# and burns through the 10-installation / 256-update inbox limits.
# See: https://docs.xmtp.org/agents/build-agents/local-database
[[deploy.volumes]]
mountPath = "/data/.xmtp-data"
name = "xmtp-data"
