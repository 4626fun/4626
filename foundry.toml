[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
auto_detect_solc = true
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ignore = ["contracts/_archive/**"]

# Needed for scripts that read frontend-generated deploy bytecode (e.g. SeedUniversalBytecodeStore).
# Keep this narrow (read-only) for safety.
fs_permissions = [
    { access = "read", path = "./frontend/src/deploy" },
    { access = "read", path = "./out" },
    { access = "read", path = "./deployments/base" },
    { access = "write", path = "./tmp" }
]

# Remappings for LayerZero and other deps
remappings = [
    "test/=test/",
    "@4626/=contracts/",
    "sudoswap/=lib/sudoswap-lssvm2/src/",
    "lib/sudoswap-lssvm2/:@manifoldxyz/=lib/sudoswap-lssvm2/lib/",
    "lib/sudoswap-lssvm2/:manifoldxyz/=lib/sudoswap-lssvm2/lib/royalty-registry-solidity/contracts/",
    "lib/sudoswap-lssvm2/:@openzeppelin/contracts/=lib/sudoswap-lssvm2/lib/openzeppelin-contracts/contracts/",
    "lib/sudoswap-lssvm2/:@openzeppelin/contracts-upgradeable/=lib/sudoswap-lssvm2/lib/openzeppelin-contracts-upgradeable/contracts/",
    "lib/sudoswap-lssvm2/:@prb/math/=lib/sudoswap-lssvm2/lib/prb-math/src/",
    "lib/sudoswap-lssvm2/:clones-with-immutable-args/=lib/sudoswap-lssvm2/lib/clones-with-immutable-args/src/",
    "lib/sudoswap-lssvm2/:create3-factory/=lib/sudoswap-lssvm2/lib/create3-factory/src/",
    "lib/sudoswap-lssvm2/:solmate/=lib/sudoswap-lssvm2/lib/solmate/src/",
    "universal-router/=lib/universal-router/contracts/",
    "lib/universal-router/:solmate/=lib/universal-router/lib/solmate/",
    "lib/universal-router/:permit2/=lib/universal-router/lib/permit2/",
    "lib/universal-router/:@openzeppelin/contracts/=node_modules/@openzeppelin/contracts-universal-router/",
    "lib/universal-router/:@uniswap/v2-core/=node_modules/@uniswap/v2-core/",
    "lib/universal-router/:@uniswap/v3-core/=node_modules/@uniswap/v3-core/",
    "lib/universal-router/:@uniswap/v3-periphery/=lib/universal-router/lib/v3-periphery/",
    "lib/universal-router/:@uniswap/v4-core/=lib/universal-router/lib/v4-periphery/lib/v4-core/",
    "lib/universal-router/:@uniswap/v4-periphery/=lib/universal-router/lib/v4-periphery/",
    "tamago/=verification/tamago/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@layerzerolabs/=node_modules/@layerzerolabs/",
    "@chainlink/=node_modules/@chainlink/",
    "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
    "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
    "@uniswap/=node_modules/@uniswap/",
    "continuous-clearing-auction/=lib/continuous-clearing-auction/",
    "liquidity-launcher/=lib/liquidity-launcher/",
    "solady/=lib/continuous-clearing-auction/lib/solady/src/",
    "solidity-bytes-utils/=node_modules/solidity-bytes-utils/",
    "hardhat/=node_modules/hardhat/",
    "hardhat-deploy/=node_modules/hardhat-deploy/",
    "eth-gas-reporter/=node_modules/eth-gas-reporter/",
    "base64-sol/=node_modules/base64-sol/",
    "@eth-optimism/=node_modules/@eth-optimism/",
    "@axelar-network/=node_modules/@axelar-network/"
]

additional_compiler_profiles = [
    { name = "lottery-manager-size", via_ir = true, optimizer_runs = 10 },
    { name = "alfaclub-universal-router", via_ir = true, optimizer_runs = 1 }
]

compilation_restrictions = [
    # Lottery manager is EIP-170 constrained; low-run optimization preserves
    # the full admin/VRF ABI while leaving audited runtime headroom.
    { paths = "contracts/shared/lottery/manager/LotteryManager4626.sol", optimizer_runs = 10 },
    # Registry4626 is EIP-170 constrained: at optimizer_runs = 200 its runtime is
    # 24,634 B (58 B over). Scripts that also import LotteryManager4626 (including
    # DeployInfrastructure, the greenfield registry deployer) already compiled it at
    # runs = 10 (24,368 B), so the deploy path shipped a different artifact than
    # `forge build` emitted. Pinning runs = 10 here makes the default artifact
    # byte-identical to the deployed one and keeps CREATE2 deployers deployable.
    { paths = "contracts/shared/core/Registry4626.sol", optimizer_runs = 10 },
    { paths = "contracts/other/alfaclub/universal-router/AlfaClubSudoswapAdapter.sol", version = "=0.8.26", optimizer_runs = 1 },
    { paths = "contracts/other/alfaclub/universal-router/AlfaClubUniversalRouter.sol", version = "=0.8.26", optimizer_runs = 1 }
]

[profile.default.fuzz]
runs = 256

[profile.ci]
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# C-04 (4626-292) + M-01 (audit 2026-04-25): EIP-170 size gate. CI runs
# `forge build --sizes` and the job is failed (no `|| true`) if any contract
# exceeds 24,576 bytes runtime bytecode. The gate is enforced in
# .github/workflows/test.yml at the "Run Forge build (sizes; EIP-170 blocking)"
# step. See docs/operations/contract-size-gate.md.
# ShareCcaLaunchArm is the current hot-spot contract — Sprint 2 adds
# ~<200 bytes (H-02 slot0 check + deadlines) and does not itself push it
# over the cap, but the gate is enforced going forward.

# Keep CI fuzz cheaper than local defaults; seed makes RPC/fork caches reusable.
[profile.ci.fuzz]
runs = 64
seed = "0x46264626"

[profile.ci.invariant]
runs = 32
depth = 32

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[doc]
out = "docs/_generated/contracts"
repository = "https://github.com/wenakita/4626"
ignore = ["test/**", "script/**"]
