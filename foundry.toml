[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.30"
auto_detect_solc = true
via_ir = true
optimizer = true
optimizer_runs = 200

# Needed for scripts that read frontend-generated deploy bytecode (e.g. SeedUniversalBytecodeStore).
# Keep this narrow (read-only) for safety.
fs_permissions = [
    { access = "read", path = "./frontend/src/deploy" },
    { access = "read", path = "./out" },
    { access = "read", path = "./deployments/base" },
    { access = "write", path = "./tmp" }
]

# Remappings for LayerZero and other deps
remappings = [
    "test/=test/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@layerzerolabs/=node_modules/@layerzerolabs/",
    "@chainlink/=node_modules/@chainlink/",
    "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
    "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
    "@uniswap/=node_modules/@uniswap/",
    "continuous-clearing-auction/=lib/continuous-clearing-auction/",
    "liquidity-launcher/=lib/liquidity-launcher/",
    "solady/=lib/continuous-clearing-auction/lib/solady/src/",
    "solidity-bytes-utils/=node_modules/solidity-bytes-utils/",
    "hardhat/=node_modules/hardhat/",
    "hardhat-deploy/=node_modules/hardhat-deploy/",
    "eth-gas-reporter/=node_modules/eth-gas-reporter/",
    "base64-sol/=node_modules/base64-sol/",
    "@eth-optimism/=node_modules/@eth-optimism/",
    "@axelar-network/=node_modules/@axelar-network/"
]

[profile.default.fuzz]
runs = 256

[profile.ci]
via_ir = true
optimizer = true
optimizer_runs = 200
# C-04 (4626-292): EIP-170 size gate. CI must run `forge build --sizes`
# and fail the job if any contract exceeds 24,576 bytes runtime bytecode.
# See docs/operations/contract-size-gate.md for the recommended workflow.
# CCALaunchStrategy is the current hot-spot contract — Sprint 2 adds
# ~<200 bytes (H-02 slot0 check + deadlines) and does not itself push it
# over the cap, but the gate must be enforced going forward.

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[doc]
out = "docs/_generated/contracts"
repository = "https://github.com/wenakita/4626"
ignore = ["test/**", "script/**"]
