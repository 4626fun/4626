# Review harness only: run bash IMD_CREATOR_BOOTSTRAP.sh first.
[profile.default]
src = "imd-creator-vaults/contracts"
test = "imd-creator-vaults/test"
out = "out"
libs = ["imd-creator-vaults/node_modules", "imd-creator-vaults/lib"]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["test/=imd-creator-vaults/test/", "@4626/=imd-creator-vaults/contracts/", "@openzeppelin/=imd-creator-vaults/node_modules/@openzeppelin/", "@layerzerolabs/=imd-creator-vaults/node_modules/@layerzerolabs/", "@uniswap/v4-core/=imd-creator-vaults/node_modules/@uniswap/v4-core/", "solidity-bytes-utils/=imd-creator-vaults/node_modules/solidity-bytes-utils/", "solady/=imd-creator-vaults/node_modules/solady/src/", "forge-std/=imd-creator-vaults/lib/forge-std/src/"]
additional_compiler_profiles = [{ name = "size", via_ir = true, optimizer_runs = 10 }]
compilation_restrictions = [
{ paths = "imd-creator-vaults/contracts/creator/vault/modules/CreatorOVaultCoreModule.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/agent/vault/modules/AgentOVaultCoreModule.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/creator/vault/CreatorOVault.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/agent/vault/AgentOVault.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/shared/strategies/univ3/CharmStrategy4626.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/creator/vault/CreatorShareOFT.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/shared/lottery/venue/ShareOFTRemoteLotteryQueue.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/shared/lottery/venue/ShareOFTRemoteLotteryLib.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/shared/lottery/venue/ShareOFTSpokeModule.sol", optimizer_runs = 10 },
{ paths = "imd-creator-vaults/contracts/shared/lottery/venue/IShareOFTSpokeHost.sol", optimizer_runs = 10 }
]
[profile.default.fuzz]
runs = 64
seed = "0x46264626"
[profile.default.invariant]
runs = 32
depth = 32
