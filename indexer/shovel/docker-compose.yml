services:
  shovel:
    image: indexsupply/shovel:1.6
    # NOTE: v1.6 converge fails in this environment — use scripts/start.sh (shovel-main binary).
    restart: unless-stopped
    volumes:
      - ./config.generated.json:/config.json:ro
    command: ['shovel', '-config', '/config.json']
    # Shovel reads pg_url + RPC URLs from the generated JSON (render-config embeds them).
    # Regenerate config after env changes: node render-config.mjs --write && docker compose up -d
