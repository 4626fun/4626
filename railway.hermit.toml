# --------------------------------------------------------------------------
# Railway deployment config — Hermit AlfaClub/Pinata Agent
# --------------------------------------------------------------------------
# Deploy:
#   railway up --service 4626-hermit-agent -c
#
# This service uses the shared agent image with AGENT_PROCESS=hermit, so it
# starts only the AlfaClub chat bridge and Privy token refresher. Keepr/XMTP
# remains isolated in the main Railway service.
# --------------------------------------------------------------------------

[build]
dockerfilePath = "frontend/Dockerfile.hermit"
watchPatterns = [
  "/frontend/Dockerfile.hermit",
  "/frontend/server/_lib/alfaclub/**",
  "/frontend/server/_lib/hermit/**",
  "/frontend/server/_lib/infra/**",
  "/frontend/server/agents/hermit/**",
  "/frontend/server/agents/core/**",
  "/frontend/server/commands/**",
  "/frontend/api/**",
  "/frontend/src/config/**",
  "/frontend/src/wallet/**",
  "/frontend/package.json",
  "/frontend/pnpm-lock.yaml",
  "/frontend/tsconfig.json",
  "/frontend/tsconfig.node.json",
  "/patches/**",
  "/railway.hermit.toml",
]

[deploy]
numReplicas = 1
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
