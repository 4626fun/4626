# --------------------------------------------------------------------------
# Railway deployment config — Hermit AlfaClub/Pinata Creative Agent
# (for 4626-alfaclub-bridge / hermit.4626.fun service)
# --------------------------------------------------------------------------
# EXACT UI SETTINGS TO COPY (for this service in Railway):
#
# Build
#   Dockerfile Path:          frontend/Dockerfile.hermit
#   Watch Paths:              (leave empty or use this file's watchPatterns)
#
# Deploy
#   Custom Start Command:     ./node_modules/.bin/tsx server/agents/hermit/bootstrap.ts
#   Healthcheck Path:         /healthz
#   Healthcheck Timeout:      300
#   Restart Policy:           On Failure
#   Max restart retries:      5
#
# Config-as-code
#   Railway Config File:      railway.hermit.toml
#
# This dedicated setup + Dockerfile.hermit is what finally makes the
# healthcheck pass reliably after all the bootstrap / early listener work.
# --------------------------------------------------------------------------

[build]
dockerfilePath = "frontend/Dockerfile.hermit"
watchPatterns = [
  "/frontend/Dockerfile.hermit",
  "/frontend/server/_lib/alfaclub/**",
  "/frontend/server/_lib/hermit/**",
  "/frontend/server/_lib/infra/**",
  "/frontend/server/agents/hermit/**",
  "/frontend/server/agents/core/**",
  "/frontend/server/commands/**",
  "/frontend/api/**",
  "/frontend/src/config/**",
  "/frontend/src/wallet/**",
  "/frontend/package.json",
  "/frontend/pnpm-lock.yaml",
  "/frontend/tsconfig.json",
  "/frontend/tsconfig.node.json",
  "/patches/**",
  "/railway.hermit.toml",
]

[deploy]
numReplicas = 1

# Healthcheck must succeed for the deploy to be considered healthy.
# bootstrap.ts serves /healthz very early (before heavy imports).
healthcheckPath = "/healthz"
healthcheckTimeout = 300   # 5 minutes — generous for first cold start + module load

# Restart on crash (common during early debugging of env / module issues).
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Start command can be left to the Dockerfile CMD, or overridden in UI
# to the ultra-minimal form above for fastest health listener start.
