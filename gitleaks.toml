title = "4626 gitleaks"

[extend]
useDefault = true

# Global allowlist — vendored / third-party content we do not control.
# These paths contain copy-pasted reference artefacts, audit snapshots,
# and configuration fixtures that cannot be edited without breaking
# provenance. They are exempt from all detectors.
[allowlist]
description = "Vendored audit snapshots, third-party docs, and pinned deployment manifests"
paths = [
  '''^design/audit-source-snapshots/''',
  '''^docs/vibeship/''',
  '''^docs/scan2\.txt$''',
  '''^docs/yearn/''',
  '''^\.cursor/skills/moltbook/''',
  '''^frontend/skills/moltbook/''',
  '''^deployment-vault-v3-final\.json$''',
]

# Rule-scoped allowlist for the `generic-api-key` heuristic.
#
# Background: L-21 (Linear 4626-369, Phase 6 SEV-607) flagged the
# previous broad `frontend/api/__tests__/` path exemption on the global
# allowlist as a credential-smuggling risk — a developer could stash a
# real pk_live_*, sk_test_*, AKIA*, or ghp_* inside a test file and
# gitleaks would never see it.
#
# Unit-test fixtures for this repo use field names such as
# `privyToken`, `bridgeToken`, `friendKeyContract`, and
# `SOLANA_DEFAULT_BRIDGE_TOKEN` which gitleaks' catch-all
# `generic-api-key` rule flags as secret-shaped. The narrow fix is to
# allow *only* the `generic-api-key` rule to skip these paths, while
# every provider-specific detector (aws-access-token, github-pat,
# stripe-access-token, slack-user-token, private-key, etc.) continues
# to apply. A real cloud credential committed into a test file will
# still fail CI.
#
# The allowlist was extended (4626-399) with three further categories of
# false positives:
#   • `.env.example` template files — by definition placeholders, and
#     provider-specific detectors still apply so a committed real AWS /
#     Stripe / GitHub credential in an example file still fails CI.
#   • EVM contract / EOA addresses (`0x` + 40 hex chars, optional trailing
#     `.`) — these are public on-chain identifiers, not secrets.
#   • Specific well-known public constants (Anvil default test key,
#     Chainlink VRF keyhash on Base) and DB-column / React-constant
#     identifiers that match the heuristic's entropy threshold.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "Test fixtures, env.example templates, public on-chain identifiers, and well-known public constants"
paths = [
  '''^frontend/api/__tests__/''',
  '''^frontend/src/.+\.test\.tsx?$''',
  '''^frontend/server/.+\.test\.ts$''',
  '''^frontend/server/.+/__tests__/''',
  '''^cre/tests/''',
  # env.example files are distribution templates, not secret stores.
  # Provider-specific detectors still scan them.
  '''(^|/)\.env\.example$''',
  # Standalone HTML utility whose only config values are public token
  # addresses referenced from query params.
  '''^zora-enable/index\.html$''',
]
# Targets the full matched line — useful for contract addresses that
# appear embedded in larger expressions.
regexTarget = "secret"
regexes = [
  # 20-byte EVM address (contract or EOA), with optional trailing punctuation
  # gitleaks sometimes captures in the match window.
  '''^0x[0-9a-fA-F]{40}\.?$''',
]
stopwords = [
  # Column name from the agent_wallets row; variable identifier, not a secret.
  '''row.encrypted_private_key_b64''',
  '''row.encrypted_private_key_iv_b64''',
  '''row.encrypted_private_key_tag_b64''',
  # Deploy-session phase-invariant flag key (object property name).
  '''phase2InvariantGate''',
  # Well-known Anvil account #0 private key (public, documented in
  # https://book.getfoundry.sh/reference/anvil/) used for local-only fork tests.
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  # Chainlink VRF keyHash on Base (public network constant, see
  # https://docs.chain.link/vrf/v2/subscription/supported-networks#base-mainnet).
  '''0x00b81b5a830cb0a4009fbd8904de511e28631e62ce5ad231373d3cdad373ccab''',
]

# Rule-scoped allowlist for the `private-key` detector. Gitleaks matches
# `-----BEGIN PRIVATE KEY-----` markers on sight, but some files contain
# PEM *template literals* that wrap an interpolated base64 segment fetched
# at runtime — no key material is stored in the source tree.
[[rules]]
id = "private-key"
[rules.allowlist]
description = "PEM template literals that embed a runtime-interpolated ${b64} segment are format strings, not keys"
regexTarget = "secret"
regexes = [
  # Matches the exact template: -----BEGIN PRIVATE KEY-----\n${b64}\n-----END PRIVATE KEY-----
  '''^-----BEGIN PRIVATE KEY-----\\n\$\{b64\}\\n-----END PRIVATE KEY-----$''',
]
