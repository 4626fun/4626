<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultImageGenerator Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; }
  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; }
  .label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #71717a; }
  .brand-btn { border: 1px solid rgba(99,102,241,0.4); background: rgba(99,102,241,0.12); }
  .emerald-btn { border: 1px solid rgba(52,211,153,0.4); background: rgba(52,211,153,0.12); color: #a7f3d0; }
</style>
</head>
<body class="p-6">

<div id="app" style="max-width:420px">

  <!-- card wrapper -->
  <div class="card p-6 space-y-4">
    <div class="space-y-1">
      <div class="label">Vault token icon</div>
      <div class="text-xs text-zinc-600">
        Generate a custom AI-composed icon using the 4626 frame and your Zora creator coin image. Edit the instruction and hit Generate — the result becomes the token image served by 4626.fun.
      </div>
    </div>

    <!-- VaultImageGenerator -->
    <div id="generator" class="space-y-5">

      <!-- Asset preview strip -->
      <div class="flex items-center gap-4">
        <div class="flex-1 rounded-xl border border-white/10 bg-black/20 p-3 space-y-1.5">
          <div class="text-xs font-medium text-zinc-400">Frame</div>
          <div class="flex items-center gap-2">
            <img id="frameImg" src="" alt="4626 frame" class="h-10 w-10 rounded-lg object-cover" />
            <span class="text-xs text-zinc-500">4626 branded frame</span>
          </div>
        </div>

        <div class="flex-1 rounded-xl border border-white/10 bg-black/20 p-3 space-y-1.5">
          <div class="text-xs font-medium text-zinc-400">Subject</div>
          <div id="subjectLoading" class="flex items-center gap-2 opacity-50">
            <div class="h-10 w-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center">
              <span class="text-zinc-600 text-xs">?</span>
            </div>
            <span class="text-xs text-zinc-600">Loading from Zora…</span>
          </div>
          <div id="subjectLoaded" class="flex items-center gap-2 hidden">
            <img id="subjectImg" src="" alt="Creator coin" class="h-10 w-10 rounded-lg object-cover" />
            <span class="text-xs text-zinc-500">From Zora coin</span>
          </div>
        </div>
      </div>

      <!-- Instruction -->
      <label class="block space-y-1.5">
        <div class="text-xs font-medium text-zinc-400">Instruction</div>
        <textarea id="instruction" rows="3"
          class="w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2 text-sm text-zinc-100 resize-none outline-none focus:border-indigo-500/40"
        >Create a premium vault token icon for $AKITA. Place the subject inside the branded frame. Modern, elegant, high contrast.</textarea>
      </label>

      <!-- Generate row -->
      <div class="flex items-center justify-between gap-4">
        <span id="statusLabel" class="text-xs text-zinc-500"></span>
        <button id="generateBtn" type="button"
          class="brand-btn inline-flex items-center justify-center rounded-lg px-4 py-2 text-sm text-zinc-100">
          Generate
        </button>
      </div>

      <!-- Output (hidden until generated) -->
      <div id="outputSection" class="space-y-4 hidden">
        <div class="rounded-2xl border border-white/10 overflow-hidden aspect-square max-w-xs mx-auto bg-black/20 flex items-center justify-center">
          <img id="outputImg" src="" alt="Generated vault icon" class="w-full h-full object-contain" />
        </div>

        <label class="block space-y-1.5">
          <div class="text-xs font-medium text-zinc-400">Refine (optional)</div>
          <textarea rows="2" placeholder="Make the glow subtler. Center the subject more."
            class="w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2 text-sm text-zinc-100 resize-none outline-none"
          ></textarea>
        </label>

        <div class="flex items-center gap-3 justify-end">
          <button type="button" class="inline-flex items-center rounded-lg border border-white/10 bg-white/5 px-3 py-1.5 text-sm text-zinc-300">
            Refine
          </button>
          <button id="saveBtn" type="button" class="emerald-btn inline-flex items-center rounded-lg px-4 py-1.5 text-sm">
            Save as vault icon
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
