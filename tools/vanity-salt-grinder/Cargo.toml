[package]
name = "vanity-salt-grinder"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.38", features = ["derive"] }
ethers-core = "2.0.14"
getrandom = { version = "0.2.17", features = ["js"] }
hex = "0.4.3"
rlp = "0.5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
