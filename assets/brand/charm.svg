<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Charm.fi blue isometric cube with white screen -->
  <defs>
    <clipPath id="cube-clip">
      <rect width="64" height="64"/>
    </clipPath>
  </defs>
  <!-- Cube body - single blue shape -->
  <path d="
    M 8 16
    Q 8 12, 12 10
    L 30 2
    Q 33 0.5, 36 2
    L 54 10
    Q 58 12, 58 16
    L 58 46
    Q 58 50, 54 52
    L 36 60
    Q 33 61.5, 30 60
    L 12 52
    Q 8 50, 8 46
    Z
  " fill="#1A7BFF"/>
  <!-- Right face (slightly darker) -->
  <path d="
    M 33 33
    L 56 22
    Q 58 21, 58 23
    L 58 46
    Q 58 50, 54 52
    L 36 60
    Q 33 61.5, 33 59
    Z
  " fill="#0B6BF2"/>
  <!-- Top face (slightly lighter) -->
  <path d="
    M 8 16
    Q 8 12, 12 10
    L 30 2
    Q 33 0.5, 36 2
    L 54 10
    Q 58 12, 56 14
    L 33 26
    L 10 14
    Q 8 13, 8 16
    Z
  " fill="#3D8FFF"/>
  <!-- White rounded rect on left face -->
  <rect x="10" y="20" width="22" height="28" rx="6" ry="6" fill="white" transform="skewY(-12.5) translate(1, 8)"/>
</svg>
