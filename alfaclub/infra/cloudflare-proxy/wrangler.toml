name = "alfaclub-proxy"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true
routes = [
  { pattern = "alfaclub.4626.fun", zone_name = "4626.fun", custom_domain = true, enabled = true, previews_enabled = false }
]
# Bump observability so you can grep cf-ray in the dashboard.
[observability]
enabled = true

# Plain vars (non-secret). Set with `wrangler deploy` or in the dashboard.
[vars]
UPSTREAM_API_BASE = "https://api.alfaclub.app"
# Comma-separated path prefix allowlist. Anything outside this set returns 404.
# Default: history + mark-read + bot-token reply send.
ALLOWED_PATH_PREFIXES = "/api/websocket/room_history_paginate,/api/websocket/update_read_msg,/api/room"
# Cache GET responses for at most N seconds at the Worker edge (0 = no cache).
# Keep at 0 for chat history — staleness would mask new /gmeow messages.
EDGE_CACHE_TTL_SECONDS = "0"

# SECRETS — set via `wrangler secret put <NAME>`:
#   PROXY_SHARED_SECRET   — must match Vercel env ALFACLUB_CHAT_API_PROXY_SECRET.
#                           The bridge sends it in `x-proxy-secret`.
#                           Reject any request that doesn't carry the right value.

# Optional custom domain. Recommended so you don't expose *.workers.dev.
# Add via dashboard → Workers → your-worker → Triggers → Custom Domains.
# Example: relay.4626.fun
